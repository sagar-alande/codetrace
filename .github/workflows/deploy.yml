name: Build, push, and deploy to ECS Express

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: codetrace

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          # Public Supabase project URL and publishable/anon key — meant to
          # ship in the client bundle, not secrets. Stored as repo variables
          # (not repo secrets) for that reason.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Redeploy ECS Express service
        # ECR's `:latest` tag is mutable, so pushing a new image doesn't by
        # itself move already-running tasks. Re-submitting the same
        # primary-container config starts a fresh deployment, which re-pulls
        # `:latest` and rolls the service onto the new image.
        run: |
          aws ecs update-express-gateway-service \
            --service-arn arn:aws:ecs:us-east-1:965237009241:service/codetrace/codetrace \
            --primary-container '{
              "image": "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest",
              "containerPort": 8080,
              "awsLogsConfiguration": { "logGroup": "/ecs/codetrace", "logStreamPrefix": "ecs" }
            }'

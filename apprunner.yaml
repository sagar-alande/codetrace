version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm ci
      - npm run build
  env:
    # Vite inlines these into the client bundle at build time. They are the
    # Supabase project URL and the public "publishable"/anon key, which are
    # designed to be shipped to the browser and are protected by row-level
    # security on the Supabase side — not secrets. No service-role key or
    # any other credential is used here or anywhere in the client build.
    - name: VITE_SUPABASE_URL
      value: "https://kluagdsomcgxojdcincw.supabase.co"
    - name: VITE_SUPABASE_ANON_KEY
      value: "sb_publishable_5xZ_m_nefjFGAfYTuz3dfw_nNfUmQmy"
run:
  runtime-version: 18
  command: npm start
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
